name: 'Extract PR titles'
description: 'Extract PR titles between the given two git refs'
inputs:
  from:
    description: 'Git ref from where PR titles are extracted'
    required: true
  to:
    description: 'Git ref to where PR titles are extracted'
    required: true
  format:
    description: 'Pupa template of the output format'
    default: '{title} ${number}'
    required: true
  bot-format:
    description: 'Pupa template of the output format for PRs authored by bots. If not set, format is used'
    required: false
  bots:
    description: 'Comma or newline separated authors treated as bots in addition to the ones with "[bot]" suffix (e.g. machine users)'
    required: false
  reverse:
    description: 'Reverse order when "true" is set'
    required: false
  github-token:
    description: 'GitHub token used to fetch the PR author login for {author}. If not set, {author} is the git commit author name'
    required: false
outputs:
  titles:
    description: 'Extracted PR titles'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'droplet'
  color: 'gray-dark'
